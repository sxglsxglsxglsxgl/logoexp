<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CLASSNOE MESTO</title>
    <meta
      name="description"
      content="Анимация логотипа CLASSNOE MESTO с модульной сеткой и плавной прорисовкой."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero" aria-labelledby="hero-title">
      <h1 class="logo" id="hero-title" data-logo data-state="idle">
        <span class="logo__label">CLASSNOE MESTO</span>
        <span class="logo__grid" data-logo-grid aria-hidden="true"></span>
        <svg
          class="logo__svg"
          aria-hidden="true"
          role="presentation"
          data-logo-svg
          preserveAspectRatio="xMidYMid meet"
        >
          <text
            class="logo__svg-text"
            data-logo-svg-text
            x="0"
            y="0"
            dominant-baseline="text-before-edge"
            text-anchor="start"
            xml:space="preserve"
          >CLASSNOE MESTO</text>
        </svg>
      </h1>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
